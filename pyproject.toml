[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keirin-intelligence"
version = "0.1.0"
description = "Synthetic-first keirin forecasting research scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - all rights reserved" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
ml = ["lightgbm>=4,<5", "scikit-learn>=1.5,<2", "numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.scripts]
keirin-demo = "keirin_intelligence.demo:main"
keirin = "keirin_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
