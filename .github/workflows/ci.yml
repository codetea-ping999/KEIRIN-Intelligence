name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keirin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KEIRIN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keirin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,db]'
      - name: Build from empty, roll back, build again
        run: |
          keirin-db upgrade && keirin-db downgrade --to 0 && keirin-db upgrade && keirin-db status
        env:
          KEIRIN_DATABASE_URL: ${{ env.KEIRIN_TEST_DATABASE_URL }}
      - run: python -m pytest -q tests/test_migrations.py
